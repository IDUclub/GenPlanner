version: '3.4'

services:
  gen_planner:
    image: gen_planner:0.3.2s
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 80:80
    volumes:
      - ./runtime_data:/app/runtime_data

  mcp:
    image: gen_planner:0.3.2s
    command: ["python", "-m", "app.mcp_server.main"]
    ports:
      - 8766:8766
    environment:
      - GENPLANNER_API_BASE_URL=http://gen_planner:80
    depends_on:
      - gen_planner