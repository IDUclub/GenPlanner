services:
  object_effects:
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME}
    ports:
      - 80:80
    env_file:
      - .env.development
    volumes:
      - ./runtime_data:/app/runtime_data
    restart: always

  mcp:
    image: ${IMAGE}
    container_name: ${MCP_CONTAINER_NAME}
    command: ["python", "-m", "app.mcp_server.main"]
    ports:
      - 8766:8766
    env_file:
      - .env.development
    environment:
      - GENPLANNER_API_BASE_URL=http://object_effects:80
    depends_on:
      - object_effects
    restart: always

