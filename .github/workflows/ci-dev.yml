name: Kubernetes dev release

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  release:
    uses: IDUclub/urban-assistant-deploy/.github/workflows/reusable-application-release.yaml@main
    with:
      service: genplanner
      test-command: |
        python -m pip install --disable-pip-version-check poetry==2.2.1
        poetry install --with dev --no-interaction --no-ansi
        : > .env.test
        export APP_ENV=test
        export LOG_FILE=genplanner-tests.log
        export LOG_LEVEL=INFO
        export URBAN_API=http://localhost:9999
        export TEST_URBAN_API=http://localhost:9999
        export ECODONUT_API=http://localhost:9999
        export MAX_API_ASYNC_EXTRACTIONS=1
        export MAX_TIMEOUT=60
        export GENPLANNER_API_BASE_URL=http://localhost:8000
        export MCP_SERVER_PORT=8766
        export MCP_UPSTREAM_TIMEOUT_SECONDS=30
        export LLM_PROVIDER=vllm
        export VLLM_BASE_URL=http://localhost:9999
        export CHAT_MODEL=test-model
        export GENERATE_MODEL=test-model
        export ADMIN_API_TOKEN=test-token
        poetry run pytest --verbose tests
    secrets: inherit
